version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: designbook-db
    environment:
      POSTGRES_USER: designbook
      POSTGRES_PASSWORD: designbook
      POSTGRES_DB: designbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U designbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: designbook-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: designbook-api
    environment:
      DATABASE_URL: postgresql+asyncpg://designbook:designbook@db:5432/designbook
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DESIGN_EXCEL_DIR: /app/doc-files/design-excel
      ENHANCED_EXCEL_DIR: /app/doc-files/design-excel/enhanced
      REGULATIONS_DIR: /app/doc-files/regulations
      # Development stack only: migrations are not yet bootstrapped.
      CREATE_SCHEMA_ON_STARTUP: "true"
      ENABLE_ANALYSIS_EXECUTION: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ../doc-files:/app/doc-files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ──────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: designbook-celery
    environment:
      DATABASE_URL: postgresql+asyncpg://designbook:designbook@db:5432/designbook
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CREATE_SCHEMA_ON_STARTUP: "true"
      ENABLE_ANALYSIS_EXECUTION: "true"
    volumes:
      - ./backend:/app/backend
      - ../doc-files:/app/doc-files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2

  # ── Nginx Reverse Proxy ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: designbook-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
