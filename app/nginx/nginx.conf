# DesignBook — Nginx Reverse Proxy Configuration

upstream api_server {
    server api:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 100M;

    # API and WebSocket routes → FastAPI
    location /api/ {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://api_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Docs
    location /docs {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://api_server;
        proxy_set_header Host $host;
    }

    # Frontend SPA (serve static in production)
    location / {
        # In development, proxy to Vite dev server at port 5173
        # In production, serve built files from /usr/share/nginx/html
        proxy_pass http://host.docker.internal:5173;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
